name: iOS

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-tests:
    name: Swift package tests
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Test shared payload logic
        run: swift test --package-path ios/AppleHealthSyncCore

  build:
    name: Build iOS app
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build for the simulator
        run: |
          xcodebuild \
            -project ios/AppleHealthSync.xcodeproj \
            -scheme AppleHealthSync \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
