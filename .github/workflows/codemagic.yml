name: Codemagic dispatch

# Starts the Codemagic iOS release workflow through the REST API.
# The webhook URL is for git-provider events, not for build dispatch; POSTing
# an arbitrary JSON body to it fails with "Unrecognized payload".
#
# One-time setup:
#   gh secret set CODEMAGIC_API_TOKEN --repo thebillington/health-assist \
#     --body "<token from Codemagic > Account settings > API token>"
#   gh variable set CODEMAGIC_APP_ID --repo thebillington/health-assist \
#     --body "<app id from the Codemagic app URL>"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codemagic-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    name: Start Codemagic
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Start build
        env:
          CODEMAGIC_API_TOKEN: ${{ secrets.CODEMAGIC_API_TOKEN }}
          CODEMAGIC_APP_ID: ${{ vars.CODEMAGIC_APP_ID }}
        run: |
          set -euo pipefail

          if [ -z "$CODEMAGIC_API_TOKEN" ]; then
            echo "CODEMAGIC_API_TOKEN is not set" >&2
            exit 1
          fi
          if [ -z "$CODEMAGIC_APP_ID" ]; then
            echo "CODEMAGIC_APP_ID is not set" >&2
            exit 1
          fi

          response="$(curl --fail --silent --show-error \
            --request POST \
            --header "Content-Type: application/json" \
            --header "x-auth-token: $CODEMAGIC_API_TOKEN" \
            --data "{\"appId\":\"$CODEMAGIC_APP_ID\",\"workflowId\":\"ios-release\",\"branch\":\"main\"}" \
            https://api.codemagic.io/builds)"

          printf '%s\n' "$response"
          echo "Codemagic build requested."
