name: AppleHealthSync

options:
  bundleIdPrefix: uk.co.thebillington
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "2"
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: minimal

packages:
  AppleHealthSyncCore:
    path: AppleHealthSyncCore

targets:
  AppleHealthSync:
    type: application
    platform: iOS
    sources:
      - path: AppleHealthSync
    dependencies:
      - package: AppleHealthSyncCore
        product: AppleHealthSyncCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uk.co.thebillington.applehealthsync
        PRODUCT_NAME: AppleHealthSync
        INFOPLIST_FILE: AppleHealthSync/Info.plist
        CODE_SIGN_ENTITLEMENTS: AppleHealthSync/AppleHealthSync.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        ENABLE_PREVIEWS: YES
        ENABLE_USER_SCRIPT_SANDBOXING: YES
    info:
      path: AppleHealthSync/Info.plist
      properties:
        CFBundleDisplayName: "Health Assist"
        CFBundleURLTypes:
          - CFBundleURLName: uk.co.thebillington.applehealthsync
            CFBundleURLSchemes:
              - applehealthsync
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - uk.co.thebillington.applehealthsync.weekly-sync
        ITSAppUsesNonExemptEncryption: false
        NSHealthShareUsageDescription: "Health Assist reads your health data so it can send it to your Home Assistant instance."
        NSLocalNetworkUsageDescription: "Health Assist connects to your Home Assistant instance on your local network to send your health data."
        NSCameraUsageDescription: "Scan the Home Assistant QR code to configure the webhook URL and shared secret."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIRequiredDeviceCapabilities:
          - arm64
          - healthkit
    entitlements:
      path: AppleHealthSync/AppleHealthSync.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.background-delivery: true

schemes:
  AppleHealthSync:
    build:
      targets:
        AppleHealthSync: all
    run:
      config: Debug
    archive:
      config: Release
